# Logo caching
proxy_cache_path /app/logo_cache levels=1:2 keys_zone=logo_cache:10m
                 inactive=24h use_temp_path=off;

# Upstream for uWSGI with keepalive connections
# This allows connection reuse between nginx and uWSGI, reducing overhead
upstream uwsgi_backend {
    server unix:/app/uwsgi.sock;
    keepalive 32;  # Keep 32 connections alive for reuse
}

# Upstream for HTTP backend (used for streaming endpoints)
upstream http_backend {
    server 127.0.0.1:5656;
    keepalive 64;  # More keepalive connections for streaming
}

server {
    listen NGINX_PORT;

    # TCP optimizations for streaming
    tcp_nopush on;   # Send headers and beginning of file in one packet
    tcp_nodelay on;  # Disable Nagle's algorithm for low latency

    proxy_connect_timeout 75;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    client_max_body_size 0;

    # Keepalive for client connections
    keepalive_timeout 65;
    keepalive_requests 1000;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Serve Django via uWSGI
    location / {
        include uwsgi_params;
        uwsgi_pass uwsgi_backend;
    }

    location /assets/ {
        root /app/static;
    }

    location /static/ {
        root /app;
    }

    location /logos/ {
        root /data;
    }

    location /api/logos/(?<logo_id>\d+)/cache/ {
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$request_uri";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache for 24 hours
        proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
    }

    location ~ ^/api/channels/logos/(?<logo_id>\d+)/cache/ {
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$request_uri";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache for 24 hours
        proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
    }

    # admin disabled when not in dev mode
    location /admin {
        return 301 /login;
    }

    # Route HDHR request to Django
    location /hdhr {
        include uwsgi_params;
        uwsgi_pass uwsgi_backend;
    }

    # Serve FFmpeg TS streams efficiently
    location /output/stream/ {
        proxy_pass http://http_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # Enable keepalive to upstream
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # High-performance HLS streaming
    # Routes through uWSGI to preserve client activity tracking (required for session lifecycle)
    # Client tracking happens in hls_segment() view - DO NOT serve directly from disk
    location /output/hls/ {
        include uwsgi_params;
        uwsgi_pass uwsgi_backend;

        # Buffer settings optimized for HLS segments (typically 2-10MB)
        uwsgi_buffering on;
        uwsgi_buffer_size 8k;
        uwsgi_buffers 16 8k;
        uwsgi_busy_buffers_size 16k;

        # Timeouts for HLS
        uwsgi_read_timeout 300;
        uwsgi_send_timeout 300;

        # CORS headers for cross-origin playback
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Handle OPTIONS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Origin, Accept";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # WebSockets for real-time communication
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Route TS proxy requests to the dedicated instance
    location /proxy/ {
        include uwsgi_params;
        uwsgi_pass uwsgi_backend;
        uwsgi_buffering off;
        uwsgi_cache off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
    }
}
