services:
  web:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_web
    ports:
      - 9191:9191
    volumes:
      - ./data:/data
    depends_on:
      - db
      - redis
    # HLS RAM disk option (recommended for high performance):
    # Uncomment the tmpfs section below for automatic in-memory HLS segments
    # tmpfs:
    #   - /data/hls:size=1G,mode=1777
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      # HLS Output Configuration
      # Default: /data/hls (persisted to disk, survives restarts)
      #
      # For RAM disk (faster, better SSD lifespan), choose ONE option:
      #
      # OPTION 1 (Recommended): Docker tmpfs mount (above in tmpfs: section)
      #   Uncomment the tmpfs section above. No HLS_OUTPUT_PATH needed.
      #   This automatically creates a RAM disk with correct permissions.
      #
      # OPTION 2: Use container's built-in /dev/shm (512MB default)
      #   - HLS_OUTPUT_PATH=/dev/shm
      #
      # OPTION 3: Mount host ramdisk (requires permission setup on host)
      #   volumes: - /mnt/user/ramdisk:/mnt/ramdisk:rw
      #   Then run on host: chown -R $PUID:$PGID /mnt/user/ramdisk
      #   - HLS_OUTPUT_PATH=/mnt/ramdisk
      #- HLS_OUTPUT_PATH=/dev/shm
      # Legacy CPU Support (Optional)
      # Uncomment to enable legacy NumPy build for older CPUs (circa 2009)
      # that lack support for newer baseline CPU features
      #- USE_LEGACY_NUMPY=true
      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (uncomment below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)
      #- CELERY_NICE_LEVEL=5   # Celery/EPG/Background tasks (default: 5, low priority)
    #
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE
    # Optional for hardware acceleration
    #group_add:
    #  - video
    #  #- render # Uncomment if your GPU requires it
    #devices:
    #  - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)
    # Uncomment the following lines for NVIDIA GPU support
    # NVidia GPU support (requires NVIDIA Container Toolkit)
    #deploy:
    #  resources:
    #      reservations:
    #          devices:
    #              - driver: nvidia
    #                count: all
    #                capabilities: [gpu]

  celery:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_celery
    depends_on:
      - db
      - redis
    volumes:
      - ../:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: >
      bash -c "
      cd /app &&
      nice -n 5 celery -A dispatcharr worker -l info
      "

  db:
    image: postgres:14
    container_name: dispatcharr_db
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: dispatcharr_redis

volumes:
  postgres_data:
